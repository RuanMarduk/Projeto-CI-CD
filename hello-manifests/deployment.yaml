apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
  labels:
    app: hello-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-app
  template:
    metadata:
      labels:
        app: hello-app
    spec:
      containers:
      - name: hello-app
        image: docker.io/ruanmarduk/hello-app:0e55928ec7fd3e68e6442269bd3fb1236fb228ce
        ports:
        - containerPort: 80
      imagePullSecrets:
      - name: regcred
